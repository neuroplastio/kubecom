# AUR: publish kubecom-bin whenever a stable release is published, and on
# demand. The package is the launcher plus a seed build (D295); packaging/aur/
# publish.sh renders the PKGBUILD from the release's binaries, builds it with
# makepkg exactly as a user would, and pushes it to the AUR.
#
# makepkg refuses to run as root and needs base-devel, so the job runs in an
# Arch container as a non-root user. It reads the two linux binaries from the
# GitHub release (both architectures), so the package can be built for either.
#
# The one credential is AUR_SSH_PRIVATE_KEY — the private half of the AUR
# account's key (see the repository's human-tasks note). Without it the job
# skips rather than fails, like every publisher here.
name: AUR

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish to the AUR (e.g. 26.10.06)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: publish kubecom-bin
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Pick the tag
        id: tag
        env:
          IN_TAG: ${{ inputs.tag }}
          REL_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="${IN_TAG:-$REL_TAG}"
          if printf '%s' "$tag" | grep -Eq '^[0-9]{2}\.[0-9]{2}\.[0-9]{2}$'; then
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          else
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "::notice::'$tag' is not a day-named release; nothing for the AUR"
          fi

      - uses: actions/checkout@v4
        if: steps.tag.outputs.skip != '1'

      - name: Install tools
        if: steps.tag.outputs.skip != '1'
        run: pacman -Syu --noconfirm --needed git openssh curl libarchive zstd

      - name: Publish
        if: steps.tag.outputs.skip != '1'
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          RELEASE: ${{ steps.tag.outputs.tag }}
        run: |
          set -eu
          if [ -z "${AUR_SSH_PRIVATE_KEY:-}" ]; then
            echo "::notice::AUR_SSH_PRIVATE_KEY is not set; skipping the AUR publish"
            exit 0
          fi
          dir=/tmp/release
          mkdir -p "$dir"
          for f in kubecom-launcher_linux_amd64 kubecom-launcher_linux_arm64 \
                   kubecom_linux_amd64 kubecom_linux_arm64; do
            curl -fsSL "https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE/$f" -o "$dir/$f"
          done

          # makepkg refuses to run as root; the publish is its whole build.
          id -u builder >/dev/null 2>&1 || useradd -m builder
          install -d -m700 -o builder -g builder /home/builder/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /home/builder/.ssh/aur
          chmod 600 /home/builder/.ssh/aur
          chown builder:builder /home/builder/.ssh/aur
          chown -R builder:builder "$dir"
          ssh-keyscan -t ed25519 aur.archlinux.org > /home/builder/.ssh/known_hosts 2>/dev/null || true
          chown builder:builder /home/builder/.ssh/known_hosts

          su builder -s /bin/sh -c "cd '$GITHUB_WORKSPACE' && \
            GIT_SSH_COMMAND='ssh -i /home/builder/.ssh/aur -o IdentitiesOnly=yes -o UserKnownHostsFile=/home/builder/.ssh/known_hosts' \
            packaging/aur/publish.sh '$RELEASE' '$dir' --push"
